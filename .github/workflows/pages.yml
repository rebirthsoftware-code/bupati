name: GitHub Pages

# Siteyi statik olarak derler ve GitHub Pages'e yayınlar.
# Depo ayarlarındaki her iki kaynak seçeneğiyle de çalışır:
#   • Settings → Pages → Source: "GitHub Actions"        → deploy işi yayınlar
#   • Settings → Pages → Source: "Deploy from a branch"  → gh-pages dalı yayınlanır
# Hangisi seçiliyse o devreye girer; diğeri sessizce atlanır.

on:
  push:
    branches:
      - main
      - claude/veteriner-website-design-gisz08
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Statik siteyi derle
        run: node scripts/build-static.mjs
        env:
          # Proje sitesi https://<kullanici>.github.io/<repo>/ altında yayınlanır
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Pages çıktısını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: gh-pages dalını güncelle
        run: |
          cd out
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Yayın: ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

  # Kaynak "GitHub Actions" ise yayını bu iş yapar.
  # Kaynak "Deploy from a branch" ise bu adım başarısız olur; site zaten gh-pages
  # dalından yayınlandığı için hata yok sayılır.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
