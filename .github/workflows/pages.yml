name: GitHub Pages

# Siteyi statik olarak derler ve gh-pages dalına yayınlar.
# Depo ayarlarında: Settings → Pages → Source: "Deploy from a branch" → gh-pages / (root)

on:
  push:
    branches:
      - main
      - claude/veteriner-website-design-gisz08
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Statik siteyi derle
        run: node scripts/build-static.mjs
        env:
          # Proje sitesi https://<kullanici>.github.io/<repo>/ altında yayınlandığı için
          BASE_PATH: /${{ github.event.repository.name }}

      - name: gh-pages dalına yayınla
        run: |
          cd out
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Yayın: ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
